<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberFox SQLi Lab</title>
<style>
body{
  margin:0;
  font-family:monospace;
  background:#050505;
  color:#00ff88;
}

/* FIXED HEADER */
.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#0b0b0b;
  border-bottom:1px solid #222;
  padding:10px 20px;
  display:flex;
  justify-content:space-between;
  color:#ff1a1a;
}

/* CONTENT AREA */
.content{
  margin-top:60px;
  padding:20px;
}

/* BOX STYLE */
.box{
  border:1px solid #222;
  padding:20px;
  background:#0b0b0b;
  border-radius:8px;
}
</style>
</head>
<body>

<div class="header">
  <div>CYBERFOX SQLi LAB</div>
  <div id="roleDisplay">Guest</div>
</div>

<div class="content" id="content">

  <div class="box">
    <h2>Loading Panel...</h2>
    <p>Please login first</p>
    <a href="login.html" style="color:#ff1a1a;">Go to Login</a>
  </div>

</div>

<script>
// role system (simulation)
let role = localStorage.getItem("role");

// USER PANEL
const userUI = `
<div class="box">
<h2>User Panel</h2>
<ul>
<li>View Profile</li>
<li>Dashboard Access</li>
</ul>
</div>
`;

// ADMIN PANEL
const adminUI = `
<div class="box">
<h2>Admin Panel</h2>
<ul>
<li>View Logs</li>
<li>Manage Users</li>
</ul>
</div>
`;

// ADMINISTRATOR PANEL
const rootUI = `
<div class="box">
<h2>Administrator Panel</h2>
<ul>
<li>System Control</li>
<li>Server Config</li>
</ul>
</div>
`;

if(role === "user"){
  document.getElementById("content").innerHTML = userUI;
  document.getElementById("roleDisplay").innerText = "USER";
}
else if(role === "admin"){
  document.getElementById("content").innerHTML = adminUI;
  document.getElementById("roleDisplay").innerText = "ADMIN";
}
else if(role === "administrator"){
  document.getElementById("content").innerHTML = rootUI;
  document.getElementById("roleDisplay").innerText = "ROOT";
}
else{
  document.getElementById("roleDisplay").innerText = "GUEST";
}

</script>

</body>
</html>
